  <circle cx="64" cy="64" r="50" fill="#C3D7FC" opacity="0.3"/>
  <!-- Capybara head silhouette -->
  <path d="M38 52 C38 42 46 36 54 36 C57 36 60 38 64 38 C68 38 71 36 74 36 C82 36 90 42 90 52 C90 58 88 64 88 74 C88 88 78 96 64 96 C50 96 40 88 40 74 C40 64 38 58 38 52 Z" fill="#8F5D38"/>
  <!-- Ears -->
  <ellipse cx="44" cy="38" rx="8" ry="12" fill="#8F5D38" transform="rotate(-15 44 38)"/>
  <ellipse cx="84" cy="38" rx="8" ry="12" fill="#8F5D38" transform="rotate(15 84 38)"/>
  <ellipse cx="44" cy="38" rx="4" ry="7" fill="#C3D7FC"/>
  <ellipse cx="84" cy="38" rx="4" ry="7" fill="#C3D7FC"/>
  <!-- Big Eyes -->
  <circle cx="50" cy="58" r="10" fill="#030E50"/>
  <circle cx="78" cy="58" r="10" fill="#030E50"/>
  <circle cx="48" cy="55" r="3.5" fill="#FFFFFF"/>
  <circle cx="76" cy="55" r="3.5" fill="#FFFFFF"/>
  <circle cx="52" cy="61" r="1.5" fill="#FFFFFF"/>
  <circle cx="80" cy="61" r="1.5" fill="#FFFFFF"/>
  <!-- Snout -->
  <path d="M54 68 C54 64 74 64 74 68 C74 78 54 78 54 68 Z" fill="#030E50" opacity="0.85"/>
  <ellipse cx="60" cy="68" rx="1.5" ry="2.5" fill="#C3D7FC"/>
  <ellipse cx="68" cy="68" rx="1.5" ry="2.5" fill="#C3D7FC"/>
